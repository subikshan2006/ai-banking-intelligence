services:
  - type: web
    name: banking-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt && python -c "from app.seed.seed_data import seed_database; seed_database()"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: LLM_PROVIDER
        value: deterministic

  - type: web
    name: banking-ai-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
